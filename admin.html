<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>管理後台｜東京友伴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=M+PLUS+Rounded+1c:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <main class="admin">
    <div id="demo-banner" class="demo-banner" hidden>
      示範模式：尚未連接 Firebase，這裡用 24 位假的報名者讓你試配對，建立的小組只存在這台裝置。
    </div>

    <header class="admin-head">
      <div>
        <h1>管理後台</h1>
        <p class="muted small">系統先依相似度排好小組，你調整後再按「建立」。</p>
      </div>
      <a href="index.html" class="btn-link">回到首頁</a>
    </header>

    <div id="gate" class="card" hidden></div>

    <div id="console" hidden>
      <section class="card admin-controls">
        <div class="admin-row">
          <label for="week">配對週次（週三公布）</label>
          <input id="week" type="week">
        </div>
        <div class="stats" id="stats"></div>
        <div class="admin-actions">
          <button id="run" type="button" class="btn btn-primary">自動配對</button>
          <button id="save-all" type="button" class="btn btn-outline" hidden>建立全部小組</button>
        </div>
        <p id="admin-msg" class="admin-msg" role="status"></p>
      </section>

      <section>
        <h2 class="admin-h2">建議的小組 <span id="sugg-count" class="count"></span></h2>
        <div id="suggestions" class="group-grid"></div>
      </section>

      <section>
        <h2 class="admin-h2">還沒分組的人 <span id="pool-count" class="count"></span></h2>
        <div id="pool" class="card pool"></div>
      </section>

      <section>
        <h2 class="admin-h2">這個月已建立的小組 <span id="saved-count" class="count"></span></h2>
        <div id="saved" class="group-grid"></div>
      </section>
    </div>
  </main>

  <script type="module" src="admin.js"></script>
</body>
</html>
