<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>東京友伴 Tokyo Friends</title>
  <meta name="description" content="在東京，找到合得來的朋友。東京で気の合う友達を。Find friends in Tokyo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;600&family=Noto+Serif+TC:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=20261018-3">
</head>
<body>
  <!-- 插畫元件（原創） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="plum" viewBox="0 0 40 40">
      <g fill="#FF8FB8" stroke="#3B2A45" stroke-width="2">
        <circle cx="20" cy="9" r="8"/><circle cx="30.5" cy="16.6" r="8"/><circle cx="26.5" cy="29" r="8"/>
        <circle cx="13.5" cy="29" r="8"/><circle cx="9.5" cy="16.6" r="8"/>
      </g>
      <circle cx="20" cy="20" r="5.5" fill="#FFD93D" stroke="#3B2A45" stroke-width="2"/>
    </symbol>
    <symbol id="bubbletea" viewBox="0 0 48 72">
      <path d="M27 2l-4 22" stroke="#3B2A45" stroke-width="7" stroke-linecap="round"/>
      <path d="M27 2l-4 22" stroke="#FF6FAE" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M6 22h36l-5 44a4 4 0 0 1-4 4H15a4 4 0 0 1-4-4z" fill="#F7D3AE" stroke="#3B2A45" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="3" y="17" width="42" height="7" rx="3.5" fill="#FFFFFF" stroke="#3B2A45" stroke-width="2.5"/>
      <g fill="#3B2A45"><circle cx="16" cy="61" r="3.2"/><circle cx="24" cy="63" r="3.2"/><circle cx="32" cy="61" r="3.2"/><circle cx="20" cy="55" r="3.2"/><circle cx="28" cy="55" r="3.2"/></g>
      <circle cx="18" cy="38" r="2.2" fill="#3B2A45"/><circle cx="30" cy="38" r="2.2" fill="#3B2A45"/>
      <ellipse cx="13.5" cy="43" rx="3.5" ry="2" fill="#FF6FAE" opacity=".6"/><ellipse cx="34.5" cy="43" rx="3.5" ry="2" fill="#FF6FAE" opacity=".6"/>
      <path d="M21 43q3 3 6 0" fill="none" stroke="#3B2A45" stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="lantern" viewBox="0 0 30 44">
      <circle cx="15" cy="38" r="5" fill="#FFE27A" opacity=".7"/>
      <path d="M2 2h26l-5 30H7z" fill="currentColor" stroke="#3B2A45" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M8 2l2 30M22 2l-2 30" stroke="#3B2A45" stroke-width="1.2" opacity=".35"/>
      <circle cx="15" cy="36" r="2.6" fill="#FF9F1C" stroke="#3B2A45" stroke-width="1.4"/>
    </symbol>
  </svg>

  <main class="app">
    <div class="langbar" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="zh">中文</button>
      <button type="button" class="lang-btn" data-lang="ja">日本語</button>
      <button type="button" class="lang-btn" data-lang="en">EN</button>
    </div>

    <div id="demo-banner" class="demo-banner" data-i18n-html="demo" hidden></div>

    <!-- 1. 手機註冊 -->
    <section id="screen-register" class="screen" hidden>
      <header class="brand">
        <svg class="brand-mark" aria-hidden="true"><use href="#plum"/></svg>
        <span class="brand-text">
          <span class="brand-name" data-i18n="brand"></span>
          <span class="brand-sub">TOKYO FRIENDS</span>
        </span>
      </header>

      <!-- Tokyo seasonal illustration: quiet ink lines and muted sakura tones -->
      <svg class="banner" viewBox="0 0 720 250" role="img" data-i18n-aria="bannerAlt">
        <defs>
          <linearGradient id="tokyo-sky" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#e9eeeb"/>
            <stop offset="1" stop-color="#f8eee5"/>
          </linearGradient>
          <linearGradient id="tokyo-sun" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e4b8ad" stop-opacity=".8"/>
            <stop offset="1" stop-color="#f1d8c9" stop-opacity=".2"/>
          </linearGradient>
          <clipPath id="banner-clip"><rect x="1" y="1" width="718" height="248" rx="12"/></clipPath>
        </defs>
        <g clip-path="url(#banner-clip)">
          <rect width="720" height="250" fill="url(#tokyo-sky)"/>
          <circle cx="555" cy="65" r="48" fill="url(#tokyo-sun)"/>
          <path d="M0 190 Q110 158 220 185 T445 178 T720 172 V250 H0Z" fill="#d8e0d8" opacity=".72"/>
          <g fill="#d6d8d2" stroke="#b6beb7" stroke-width="1">
            <path d="M18 154h42v96H18z M70 132h56v118H70z M137 169h40v81h-40z M188 145h52v105h-52z M470 155h43v95h-43z M523 130h48v120h-48z M581 161h39v89h-39z M630 145h65v105h-65z"/>
            <path d="M18 170h42M70 151h56M188 165h52M523 150h48M630 165h65" fill="none" stroke="#f7f1e9" stroke-width="2"/>
          </g>
          <g fill="#b9c9c1" opacity=".9">
            <path d="M285 250l34-154h12l34 154z"/>
            <path d="M300 204h50M306 177h38M312 151h26M318 124h14" fill="none" stroke="#eef0e9" stroke-width="5"/>
            <path d="M315 95h16l-5-19h-6z"/>
            <path d="M320 76v-20" stroke="#8c9e96" stroke-width="2"/>
          </g>
          <g fill="none" stroke="#9caa9f" stroke-width="3" stroke-linecap="round">
            <path d="M0 48Q85 76 150 44T300 32"/>
            <path d="M30 50l-15-13M63 59l-3-20M99 57l13-17M141 48l-1-19M181 41l14-15M222 36l-1-16"/>
          </g>
          <g fill="#d8a8a1" opacity=".88">
            <ellipse cx="17" cy="33" rx="8" ry="4" transform="rotate(30 17 33)"/>
            <ellipse cx="43" cy="47" rx="8" ry="4" transform="rotate(-25 43 47)"/>
            <ellipse cx="76" cy="39" rx="8" ry="4" transform="rotate(45 76 39)"/>
            <ellipse cx="110" cy="37" rx="8" ry="4" transform="rotate(-30 110 37)"/>
            <ellipse cx="147" cy="29" rx="8" ry="4" transform="rotate(25 147 29)"/>
            <ellipse cx="178" cy="32" rx="8" ry="4" transform="rotate(-20 178 32)"/>
            <ellipse cx="209" cy="21" rx="8" ry="4" transform="rotate(35 209 21)"/>
            <ellipse cx="242" cy="22" rx="8" ry="4" transform="rotate(-15 242 22)"/>
          </g>
          <g fill="#c58c84" opacity=".72">
            <circle cx="34" cy="27" r="2"/><circle cx="63" cy="48" r="2"/><circle cx="92" cy="31" r="2"/>
            <circle cx="127" cy="44" r="2"/><circle cx="161" cy="20" r="2"/><circle cx="198" cy="30" r="2"/>
          </g>
          <path d="M0 224Q130 208 252 226T500 222T720 215V250H0Z" fill="#b9c9bd" opacity=".7"/>
          <path d="M0 238Q120 222 245 238T490 235T720 228" fill="none" stroke="#f9f3eb" stroke-width="2"/>
        </g>
        <rect x="1" y="1" width="718" height="248" rx="12" fill="none" stroke="#d9cec2" stroke-width="1.5"/>
      </svg>

      <div class="intro">
        <h1 data-i18n-html="heroTitle"></h1>
        <p class="muted" data-i18n="heroSub"></p>
      </div>

      <div class="auth-tabs" role="group" data-i18n-aria="authMode">
        <button type="button" class="auth-tab" data-mode="signup" data-i18n="tabSignup"></button>
        <button type="button" class="auth-tab" data-mode="login" data-i18n="tabLogin"></button>
      </div>

      <form id="auth-form" class="card" novalidate>
        <div class="field">
          <label for="email" data-i18n="emailLabel"></label>
          <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@example.com" required>
        </div>
        <div class="field">
          <label for="password" id="password-label" data-i18n="passwordLabel"></label>
          <input id="password" type="password" autocomplete="new-password" minlength="8" required>
        </div>
        <button id="auth-submit" type="submit" class="btn btn-primary"></button>
        <button id="forgot" type="button" class="btn-link" data-i18n="forgot" hidden></button>
      </form>

      <div id="verify-box" class="card verify-box" hidden>
        <h2 data-i18n="verifyTitle"></h2>
        <p class="muted" id="verify-text"></p>
        <button id="verify-done" type="button" class="btn btn-primary" data-i18n="verifyDone"></button>
        <button id="verify-resend" type="button" class="btn btn-outline" data-i18n="verifyResend"></button>
        <button id="logout-0" type="button" class="btn-link" data-i18n="useOtherEmail"></button>
      </div>

      <p id="register-info" class="info" role="status"></p>
      <p id="register-error" class="error" role="alert"></p>
      <p class="note small" data-i18n-html="privacyNote"></p>
    </section>

    <!-- 2. 個人檔案 -->
    <section id="screen-profile" class="screen" hidden>
      <div class="topbar">
        <span class="step" data-i18n="step2"></span>
        <button id="logout-1" type="button" class="btn-link" data-i18n="logout"></button>
      </div>

      <div class="intro">
        <h1 data-i18n="profileTitle"></h1>
        <p class="muted" data-i18n="profileSub"></p>
      </div>

      <form id="profile-form" novalidate>
        <div class="field avatar-field">
          <span class="field-title" data-i18n="avatarTitle"></span>
          <div class="avatar-row">
            <div class="avatar-preview" aria-hidden="true">
              <img id="avatar-img" alt="" hidden>
              <span id="avatar-placeholder" class="avatar-ph"><svg><use href="#plum"/></svg></span>
            </div>
            <div class="avatar-actions">
              <label for="avatar-file" class="btn btn-outline btn-small" data-i18n="choosePhoto"></label>
              <input id="avatar-file" class="visually-hidden" type="file" accept="image/*">
              <button id="avatar-remove" type="button" class="btn-link" data-i18n="removePhoto" hidden></button>
            </div>
          </div>
          <p class="hint" data-i18n="avatarHint"></p>
        </div>

        <div class="field">
          <label for="nick" data-i18n="nick"></label>
          <input id="nick" type="text" maxlength="20" data-i18n-ph="nickPh" required>
        </div>

        <div class="field">
          <label for="nationality" data-i18n="nationality"></label>
          <select id="nationality" required></select>
          <input id="nationality-other" type="text" maxlength="30" data-i18n-ph="nationalityOtherPh" data-i18n-aria="nationalityOtherPh" hidden>
        </div>

        <div class="field">
          <label for="area" data-i18n="area"></label>
          <select id="area" required></select>
          <input id="area-other" type="text" maxlength="30" data-i18n-ph="areaOtherPh" hidden>
        </div>

        <fieldset class="field">
          <legend><span data-i18n="interests"></span><span id="interest-count" class="count"></span></legend>
          <div id="chips-interests" class="chip-groups"></div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="activities"></legend>
          <div id="chips-activities" class="chip-groups"></div>
          <input id="activity-other" type="text" maxlength="40" data-i18n-ph="activityOtherPh" data-i18n-aria="activityOtherPh">
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="langs"></legend>
          <div id="chips-langs" class="chips"></div>
          <div id="lang-levels" class="lang-levels"></div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="wants"></legend>
          <div id="chips-wants" class="chips"></div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="genderWant"></legend>
          <div id="chips-genderwant" class="chips"></div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="ageTitle"></legend>
          <div class="free-box">
            <label for="age" class="sub-label" data-i18n="myAge"></label>
            <select id="age" required></select>
            <span class="sub-label" data-i18n="ageWant"></span>
            <div id="chips-agewant" class="chips"></div>
          </div>
          <p class="hint" data-i18n="ageHint"></p>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="friendStyle"></legend>
          <p class="hint" data-i18n="friendStyleHint"></p>
          <div id="prefs-box" class="free-box"></div>
        </fieldset>

        <fieldset class="field">
          <legend data-i18n="freeTime"></legend>
          <div class="free-box">
            <label for="lifestyle" class="sub-label" data-i18n="lifestyle"></label>
            <select id="lifestyle" required></select>
            <span class="sub-label" data-i18n="freeTimeWhen"></span>
            <div id="chips-free" class="chips"></div>
          </div>
        </fieldset>

        <div class="field">
          <label for="years" data-i18n="years"></label>
          <select id="years" required></select>
        </div>

        <label class="agree">
          <input id="agree" type="checkbox" required>
          <span data-i18n-html="agree"></span>
        </label>

        <p id="profile-error" class="error" role="alert"></p>
        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
      </form>
    </section>

    <!-- 3. 配對結果 -->
    <section id="screen-match" class="screen" hidden>
      <div class="topbar">
        <button id="edit-profile" type="button" class="btn-link" data-i18n="editProfile"></button>
        <button id="logout-2" type="button" class="btn-link" data-i18n="logout"></button>
      </div>

      <div id="waiting" hidden>
        <div class="intro">
          <svg class="waiting-art" aria-hidden="true"><use href="#bubbletea"/></svg>
          <p class="eyebrow" data-i18n="doneEyebrow"></p>
          <h1 data-i18n="waitingTitle"></h1>
          <p class="muted" data-i18n="waitingSub"></p>
        </div>
        <div class="card summary" id="my-summary"></div>
      </div>

      <div id="group" hidden>
        <div class="intro">
          <p class="eyebrow" data-i18n="matchedEyebrow"></p>
          <h1 data-i18n="groupTitle"></h1>
        </div>
        <div class="card">
          <ul id="members" class="members"></ul>
          <div class="common">
            <div class="label" data-i18n="common"></div>
            <div id="common-tags" class="tags"></div>
          </div>
        </div>
        <div class="card meet">
          <span class="meet-icon" aria-hidden="true">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
          </span>
          <div>
            <div class="meet-title" data-i18n="meetTitle"></div>
            <div id="meet-text" class="muted small"></div>
          </div>
        </div>
        <a id="chat-link" class="btn btn-primary" href="#" target="_blank" rel="noopener" data-i18n="joinChat" hidden></a>
      </div>

      <div class="footer-links">
        <a href="#rules" class="open-rules" data-i18n="rules"></a>
        <a id="report-link" href="mailto:REPLACE_WITH_CONTACT_EMAIL?subject=Tokyo%20Friends%20report" data-i18n="report"></a>
      </div>
    </section>

    <!-- 社群守則 -->
    <dialog id="rules-dialog" class="dialog">
      <h2 data-i18n="rulesTitle"></h2>
      <ul id="rules-list"></ul>
      <form method="dialog"><button class="btn btn-primary" data-i18n="gotIt"></button></form>
    </dialog>

    <div id="loading" class="loading">…</div>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
